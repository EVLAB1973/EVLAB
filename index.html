<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV LAB - הצעת מחיר מהירה</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0b10;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            max-width: 400px;
            width: 90%;
        }

        h2 {
            color: #00f2ff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed #00f2ff;
            border-radius: 15px;
            padding: 30px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: rgba(0, 242, 255, 0.1);
        }

        #fileInput { display: none; }

        .btn {
            background: #00f2ff;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4);
        }

        .btn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #00f2ff;
        }

        /* אנימציית טעינה */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #00f2ff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>EV LAB</h2>
    <p>שלח לנו צילום מסך לקבלת הצעת מחיר</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <span id="fileName">לחץ לבחירת תמונה מהגלריה</span>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <button id="sendBtn" class="btn" disabled>שלח לווצאפ של אסף</button>
    
    <div class="status" id="status">
        <div class="loader" id="loader"></div>
        <span id="statusText"></span>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    const loader = document.getElementById('loader');
    const fileNameDisplay = document.getElementById('fileName');

    // הטלפון שלך
    const MY_PHONE = "972502232222"; 

    fileInput.onchange = () => {
        if (fileInput.files.length > 0) {
            fileNameDisplay.innerText = "תמונה נבחרה: " + fileInput.files[0].name;
            sendBtn.disabled = false;
        }
    };

    sendBtn.onclick = async () => {
        const file = fileInput.files[0];
        if (!file) return;

        // שלב 1: הצגת טעינה
        sendBtn.disabled = true;
        loader.style.display = "inline-block";
        statusText.innerText = "מעלה תמונה למערכת...";

        // שלב 2: העלאה ל-Imgur (שיטה חינמית)
        const formData = new FormData();
        formData.append('image', file);

        try {
            // הערה: בשימוש אמיתי כדאי להשתמש ב-Client ID משלך מ-Imgur
            const response = await fetch('https://api.imgur.com/3/image', {
                method: 'POST',
                headers: {
                    Authorization: 'Client-ID 546c363959c87ad' // זה Client-ID ציבורי לדוגמה
                },
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                const imageUrl = data.data.link;
                statusText.innerText = "התמונה הועלתה! פותח וואטסאפ...";
                
                // שלב 3: פתיחת וואטסאפ עם הלינק
                const message = encodeURIComponent(`היי אסף, אני מעוניין בהצעת מחיר. מצורפת תמונה: ${imageUrl}`);
                window.location.href = `https://wa.me/${MY_PHONE}?text=${message}`;
            } else {
                throw new Error("העלאה נכשלה");
            }

        } catch (error) {
            console.error(error);
            statusText.innerText = "שגיאה בהעלאה. נסה שוב.";
            sendBtn.disabled = false;
            loader.style.display = "none";
        }
    };
</script>

</body>
</html>
